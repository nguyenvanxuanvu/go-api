name: Go API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: go-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      target_env: ${{ steps.target.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-test-push
    environment: ${{ needs.build-test-push.outputs.target_env }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf "%s\n" "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy to EC2 via SSH
        env:
          IMAGE: ${{ needs.build-test-push.outputs.image }}
          TARGET_ENV: ${{ needs.build-test-push.outputs.target_env }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          SSH_PORT="${EC2_SSH_PORT:-22}"
          TMP_DIR="/tmp/go-api-${{ github.run_id }}-${TARGET_ENV}"

          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" "mkdir -p '$TMP_DIR'"
          scp -P "$SSH_PORT" -r k8s "$EC2_USER@$EC2_HOST:$TMP_DIR/"

          ssh -p "$SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' TARGET_ENV='$TARGET_ENV' TMP_DIR='$TMP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v kubectl >/dev/null 2>&1 || { echo "kubectl is required on EC2"; exit 1; }
          command -v kustomize >/dev/null 2>&1 || { echo "kustomize is required on EC2"; exit 1; }
          kubectl get nodes >/dev/null

          cd "$TMP_DIR/k8s/overlays/$TARGET_ENV"
          kustomize edit set image APP_IMAGE="$IMAGE"
          kubectl apply -k .
          kubectl rollout status deployment/go-api -n "go-api-$TARGET_ENV" --timeout=120s
          kubectl -n "go-api-$TARGET_ENV" get pods,svc
          rm -rf "$TMP_DIR"
          REMOTE
